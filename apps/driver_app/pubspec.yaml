name: airride_driver
description: AIRRIDE Driver App - Airport Taxi Platform
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^13.2.0
  dio: ^5.4.1
  firebase_core: ^2.27.0
  firebase_auth: ^4.18.0
  firebase_messaging: ^14.7.20
  google_maps_flutter: ^2.6.1
  geolocator: ^11.0.0
  flutter_animate: ^4.5.0
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.2.2
  pinput: ^5.0.0
  intl: ^0.19.0
  url_launcher: ^6.2.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
